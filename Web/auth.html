<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Client/Assets/img/admin-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="Client/Assets/Styles/main.css">
    <link rel="stylesheet" href="Client/Assets/Styles/auth.css">
    <title>Connexion — Kilomètre-Santé</title>
</head>

<body class="auth-body">

    <!--un petit arrière plan décoratif, moins vide-->
    <div class="auth-bg-shapes">

        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>

    </div>

    <main class="auth-container">

        <div class="auth-card">
            <div class="auth-card__header">
                <div class="auth-logo">
                    <img src="Client/Assets/img/admin-logo.png" alt="Logo Kilomètre-Santé">
                </div>
                <h1 class="auth-title">Kilomètre<span>-Santé</span></h1>
                <p class="auth-subtitle">Espace Professionnel & Administration</p>
            </div>

            <!--Message d'erreur en cas de mauvais identifiants -->
            <div class="auth-error-box" id="error-box" aria-live="assertive">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span class="auth-error-text" id="error-message">Une erreur est survenue</span>
            </div>

            <form class="auth-form" id="login-form" novalidate>

                <div class="form-group">
                    <label for="email" class="form-label">Adresse Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="exemple@kilometresante.cg"
                            required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mot de passe</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required
                            autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" id="toggle-password"
                            aria-label="Afficher le mot de passe">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">
                    <span class="btn-text">Se connecter</span>
                    <i class="fa-solid fa-arrow-right btn-icon"></i>
                    <div class="btn-spinner" id="btn-spinner"></div>
                </button>
            </form>


            <div class="auth-card__footer">
                <a href="/" class="btn-back-home">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span>Retour à la carte publique</span>
                </a>
            </div>
        </div>
    </main>

    <script type="module" src="Client/Assets/Scripts/auth.js"></script>
</body>

</html>
