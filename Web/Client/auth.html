<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Assets/img/admin-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="Assets/Styles/main.css">
    <link rel="stylesheet" href="Assets/Styles/auth.css">
    <title>Connexion — Kilomètre-Santé</title>
</head>

<body class="auth-body">

    <!--un petit arrière plan décoratif, moins vide-->
    <div class="auth-bg-shapes">

        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>

    </div>

    <main class="auth-container">

        <div class="auth-card">
            <div class="auth-card__header">
                <div class="auth-logo">
                    <img src="Assets/img/admin-logo.png" alt="Logo Kilomètre-Santé">
                </div>
                <h1 class="auth-title">Kilomètre<span>-Santé</span></h1>
                <p class="auth-subtitle">Espace Professionnel & Administration</p>
            </div>

            <!--Message d'erreur en cas de mauvais identifiants -->
            <div class="auth-error-box" id="error-box" aria-live="assertive">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span class="auth-error-text" id="error-message">Une erreur est survenue</span>
            </div>

            <form class="auth-form" id="login-form" novalidate>

                <div class="form-group">
                    <label for="email" class="form-label">Adresse Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="exemple@kilometresante.cg"
                            required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mot de passe</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required
                            autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" id="toggle-password"
                            aria-label="Afficher le mot de passe">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">
                    <span class="btn-text">Se connecter</span>
                    <i class="fa-solid fa-arrow-right btn-icon"></i>
                    <div class="btn-spinner" id="btn-spinner"></div>
                </button>
            </form>

            <div class="auth-switch">
                <p>Pas encore de compte ? <button type="button" class="link-button" id="show-register">S'inscrire</button></p>
            </div>

            <form class="auth-form hidden" id="register-form" novalidate>
                <div class="form-group">
                    <label for="register-name" class="form-label">Nom complet</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="register-name" class="form-input" placeholder="Nom du pharmacien" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-email" class="form-label">Adresse Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="register-email" class="form-input" placeholder="exemple@pharmacie.cg" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-password" class="form-label">Mot de passe</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="register-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-password-confirm" class="form-label">Confirmer le mot de passe</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="register-password-confirm" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-pharmacy-name" class="form-label">Nom de la pharmacie</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-clinic-medical input-icon"></i>
                        <input type="text" id="register-pharmacy-name" class="form-input" placeholder="Nom de la pharmacie" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-quartier" class="form-label">Quartier</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-map-marker-alt input-icon"></i>
                        <input type="text" id="register-quartier" class="form-input" placeholder="Quartier" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-arrondissement" class="form-label">Arrondissement</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-city input-icon"></i>
                        <input type="text" id="register-arrondissement" class="form-input" placeholder="Arrondissement" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-address" class="form-label">Adresse de la pharmacie</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-road input-icon"></i>
                        <input type="text" id="register-address" class="form-input" placeholder="Adresse complète" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-telephone" class="form-label">Téléphone (optionnel)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel" id="register-telephone" class="form-input" placeholder="+242 06 660 00 00">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-register">
                    <span class="btn-text">S'inscrire</span>
                    <i class="fa-solid fa-user-plus btn-icon"></i>
                    <div class="btn-spinner" id="btn-register-spinner"></div>
                </button>

                <div class="auth-switch">
                    <p>Déjà un compte ? <button type="button" class="link-button" id="show-login">Se connecter</button></p>
                </div>
            </form>

            <div class="auth-card__footer">
                <a href="/" class="btn-back-home">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span>Retour à la carte publique</span>
                </a>
            </div>
        </div>
    </main>

    <script type="module" src="Assets/Scripts/auth.js"></script>
</body>

</html>
